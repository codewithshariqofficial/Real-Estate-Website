<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXÉ | Premier Real Estate</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="container">
            <div class="logo">LUXÉ</div>
            <ul>
                <li><a href="#listings">Listings</a></li>
                <li><a href="#map-section">Map</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <h1>Elevate Your Living</h1>
                <p>Discover the most exclusive properties in the world's most prestigious locations.</p>
                <a href="#listings" class="btn btn-gold">Explore Estates</a>
            </div>
        </section>

        <section id="listings" class="listings container">
            <div class="filter-bar">
                <div class="filter-group">
                    <label for="type">Property Type</label>
                    <select id="type">
                        <option value="all">All Types</option>
                        <option value="Villa">Villa</option>
                        <option value="Penthouse">Penthouse</option>
                        <option value="Mansion">Mansion</option>
                        <option value="Chalet">Chalet</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="price">Max Price</label>
                    <select id="price">
                        <option value="all">Any Price</option>
                        <option value="7000000">Up to $7M</option>
                        <option value="10000000">Up to $10M</option>
                        <option value="13000000">Up to $13M</option>
                        <option value="16000000">Up to $16M</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="bedrooms">Bedrooms</label>
                    <select id="bedrooms">
                        <option value="all">Any</option>
                        <option value="4">4+</option>
                        <option value="5">5+</option>
                        <option value="6">6+</option>
                    </select>
                </div>
            </div>

            <div id="property-grid" class="property-grid">
                <!-- Properties will be injected here -->
            </div>
        </section>

        <section id="map-section" class="map-section">
            <div class="container">
                <h2 class="section-title">Global Reach</h2>
                <div id="map"></div>
            </div>
        </section>
    </main>

    <footer id="contact">
        <div class="container">
            <div class="footer-content">
                <div class="footer-logo">LUXÉ</div>
                <p>Excellence in real estate since 1924.</p>
                <div class="socials">
                    <a href="#"><i class="fab fa-instagram"></i></a>
                    <a href="#"><i class="fab fa-linkedin"></i></a>
                    <a href="#"><i class="fab fa-facebook"></i></a>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2026 LUXÉ Global Estates. All Rights Reserved.</p>
            </div>
        </div>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
